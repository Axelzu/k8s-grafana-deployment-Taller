# Deployment de Grafana

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
  annotations:
   
    kubernetes.io/change-cause: "Despliegue inicial grafana 11.3.0"
spec:
  replicas: 3                  
  revisionHistoryLimit: 5      
  selector:
    matchLabels:
      app: grafana            
  strategy:
    type: RollingUpdate        
    rollingUpdate:
      maxUnavailable: 1        
      maxSurge: 1              
  template:                    
    metadata:
      labels:
        app: grafana         
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports:
            - containerPort: 3000      
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:              
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:              
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
